[project]
name = "heos-workspace"
version = "0.0.0"
description = "Workspace root for the HEOS library and its clients"
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/heos-discovery/tests", "packages/heos-cli/tests", "packages/heos-tui/tests"]

[tool.ruff]
extend-exclude = [".venv", ".build-cache"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
