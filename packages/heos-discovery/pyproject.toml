[project]
name = "heos-discovery"
version = "0.1.0"
description = "SSDP discovery of Denon HEOS devices (pyheos does not provide this)"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heos_discovery"]
