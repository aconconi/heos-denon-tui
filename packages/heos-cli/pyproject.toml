[project]
name = "heos-cli"
version = "0.1.0"
description = "Command-line client for Denon HEOS devices, built on pyheos"
requires-python = ">=3.11"
dependencies = ["pyheos", "heos-discovery", "typer>=0.12", "rich>=13"]

[project.scripts]
heos-cli = "heos_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heos_cli"]

[tool.uv.sources]
heos-discovery = { workspace = true }
